      - name: "Worker syntax and security contract QA"
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check .dpro-ready/worker-esthe-product-ready-r1.js
          python3 - <<'PY_STATIC'
          from pathlib import Path
          import hashlib, json, subprocess
          p=Path('.dpro-ready/worker-esthe-product-ready-r1.js')
          s=p.read_text(encoding='utf-8')
          checks={
            'adapter': 'DPRO-CONTROL-ADAPTER-1.0' in s,
            'worker_version': 'ESTHE-READY-R1-WORKER-20260822' in s,
            'db_version': 'ESTHE-DB-READY-R1-20260822' in s,
            'frontend_version': 'ESTHE-PAGES-READY-R1-20260822' in s,
            'owner_auth': 'dpro_owner_sessions' in s and 'dpro_owner_accounts' in s,
            'production_demo_secret_rejected': 'Production: demo secret/query credentials are never authority.' in s,
            'line_id_token_verify': 'https://api.line.me/oauth2/v2.1/verify' in s and 'data?.sub' in s and 'data.aud' in s and 'data.iss' in s,
            'staff_scope': 'esthe_staff_sessions' in s and 'STAFF_SCOPE_DENIED' in s,
            'audit': 'esthe_operation_logs' in s and 'actor_role:auth.role' in s,
            'member_private_boundary': 'verified_line_id_token' in s and 'sanitizeMemberTicket' in s,
            'reservation_ownership': s.count('requireReservationOwnership(request, body, current, shop, ctx)') >= 2,
            'no_open_admin': 'if (!ctx.adminSecret) return null' not in s,
            'version_independent_probe': 'probeFrontendContract' in s and 'probeDatabaseBaseline' in s,
          }
          report={
            'schemaVersion':1,
            'systemCode':'ESTHE',
            'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'summary':{'pass':sum(checks.values()),'fail':sum(not v for v in checks.values()),'total':len(checks)},
            'checks':checks,
          }
          Path('.dpro-ready/ESTHE-PRODUCT-READY-R1-WORKER-STATIC-QA.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if not all(checks.values()): raise SystemExit('Worker static/security QA failed')
          print(json.dumps(report['summary']))
          PY_STATIC

      # R2 fix: the QA .mjs lives under the repository so Node resolves root node_modules/playwright.
      - name: "Install Chromium for current 320px browser QA"
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --silent init -y >/dev/null 2>&1
          npm --silent install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: "Run current booking + member 320px browser QA"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/esthe-ready-320
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/esthe-ready-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          cat > .dpro-ready/esthe-ready-320.mjs <<'JS_QA'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import crypto from 'crypto';

          const base='http://127.0.0.1:4173';
          const apiHost='dpro-esthe-relax-line-api.dpromstk2000.workers.dev';
          const settings={
            ok:true,
            shop:{id:'qa-shop',shop_code:'esthe_demo_default',shop_name:'DPRO Esthe Relaxation',display_name:'DPRO Esthe Relaxation',phone:'090-0000-0001',address:'大分県別府市 デモ店舗',description:'320px QA',notice:'',completion_message:'ご予約ありがとうございます。',slot_interval_minutes:30,default_booking_days_ahead:60,booking_deadline_hours:3,same_day_booking:true},
            business_hours:[0,1,2,3,4,5,6].map(day_of_week=>({day_of_week,is_open:day_of_week!==2,open_time:'10:00:00',close_time:'20:00:00'})),
            closed_days:[],
            menus:[{id:'m1',menu_code:'facial',menu_name:'フェイシャルケア 60分',category:'フェイシャル',description:'肌状態に合わせたケア',price_yen:8800,duration_minutes:60,buffer_before_minutes:0,buffer_after_minutes:0,is_active:true,is_first_visit:false,is_ticket_target:true,display_order:1}],
            staff:[{id:'s1',staff_code:'mina',staff_name:'美奈',role:'therapist',profile:'',can_be_selected:true,is_active:true,display_order:1}],
            rooms:[{id:'r1',room_code:'room1',room_name:'ルーム1',is_active:true,display_order:1}],
            ticket_plans:[],message_templates:[],settings:[],
            booking_range:{from:'2026-08-22',to:'2026-10-21',days_ahead:60}
          };
          const myPage={
            ok:true,found:true,shop:settings.shop,
            customer:{id:'c1',customer_name:'佐藤 美咲',phone:'08000003002',visit_count:4,last_visit_date:'2026-08-01'},
            next_reservations:[{id:'res1',reservation_code:'ESTHE-QA-001',menu_id:'m1',menu_name:'フェイシャルケア 60分',staff_id:'s1',staff_name:'美奈',start_at:'2026-09-15T01:00:00.000Z',status:'reserved',menu_price_yen:8800,menu_duration_minutes:60,request_note:''}],
            past_reservations:[{id:'res0',reservation_code:'ESTHE-QA-000',menu_id:'m1',menu_name:'フェイシャルケア 60分',staff_id:'s1',staff_name:'美奈',start_at:'2026-08-01T01:00:00.000Z',status:'completed',menu_price_yen:8800,menu_duration_minutes:60}],
            history:[{id:'hist1',menu_id:'m1',menu_name:'フェイシャルケア 60分',staff_id:'s1',staff_name:'美奈',treatment_date:'2026-08-01',status:'completed'}],
            tickets:[{id:'t1',ticket_name:'フェイシャル3回券',total_count:3,remaining_count:2,purchased_at:'2026-07-01',expires_at:'2026-12-31',status:'active'}]
          };
          function json(route,obj,status=200){ return route.fulfill({status,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify(obj)}); }
          async function mockApi(page){
            await page.route(`https://${apiHost}/**`, async route=>{
              const u=new URL(route.request().url());
              if(u.pathname==='/api/public/settings') return json(route,settings);
              if(u.pathname==='/api/public/menus') return json(route,{ok:true,menus:settings.menus});
              if(u.pathname==='/api/public/staff') return json(route,{ok:true,staff:settings.staff});
              if(u.pathname==='/api/public/slots') return json(route,{ok:true,date:u.searchParams.get('date')||'2026-09-15',slots:[{time:'10:00',available:true,reasons:[]},{time:'10:30',available:true,reasons:[]}]});
              if(u.pathname==='/api/public/my-page') return json(route,myPage);
              return json(route,{ok:true});
            });
          }
          async function inspect(page,name,url,member=false){
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.setViewportSize({width:320,height:844});
            await mockApi(page);
            await page.goto(url,{waitUntil:'domcontentloaded'});
            if(member){
              const input=page.locator('#phoneInput');
              if(await input.count()){ await input.fill('08000003002'); }
              const btn=page.locator('#loadBtn');
              if(await btn.count()){ await btn.click(); }
            }
            await page.waitForTimeout(700);
            const metrics=await page.evaluate(()=>{
              const vw=document.documentElement.clientWidth;
              const doc=document.documentElement.scrollWidth;
              const body=document.body?.scrollWidth||0;
              const selectors='button,a,input,select,textarea';
              const visible=[...document.querySelectorAll(selectors)].filter(el=>{
                const st=getComputedStyle(el),r=el.getBoundingClientRect();
                return st.display!=='none' && st.visibility!=='hidden' && r.width>0 && r.height>0;
              });
              const clipped=visible.map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,id:el.id||'',text:(el.textContent||el.getAttribute('placeholder')||'').trim().slice(0,60),left:r.left,right:r.right,width:r.width};}).filter(r=>r.left < -1 || r.right > vw+1 || r.width > vw+1);
              return {viewport:vw,documentScrollWidth:doc,bodyScrollWidth:body,horizontalOverflow:doc>vw+1||body>vw+1,clippedControls:clipped,visibleControlCount:visible.length,title:document.title};
            });
            const shot=`/tmp/esthe-ready-320/${name}-320.png`;
            await page.screenshot({path:shot,fullPage:true});
            const hash=crypto.createHash('sha256').update(fs.readFileSync(shot)).digest('hex');
            return {name,url,...metrics,pageErrors:errors,screenshot:`${name}-320.png`,screenshotSha256:hash,pass:!metrics.horizontalOverflow && metrics.clippedControls.length===0 && errors.length===0};
          }
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const booking=await inspect(await context.newPage(),'booking',`${base}/index-brush.html`,false);
          const member=await inspect(await context.newPage(),'member',`${base}/member.html?phone=08000003002`,true);
          await browser.close();
          const report={schemaVersion:1,systemCode:'ESTHE',viewport:320,tests:[booking,member],pass:booking.pass&&member.pass};
          fs.writeFileSync('.dpro-ready/ESTHE-PRODUCT-READY-R1-320-QA.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if(!report.pass) process.exit(1);
          JS_QA
          node .dpro-ready/esthe-ready-320.mjs
          rm -f .dpro-ready/esthe-ready-320.mjs

      - name: "Upload 320px screenshots"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ESTHE-PRODUCT-READY-R1-320-QA-${{ github.run_id }}"
          path: |
            /tmp/esthe-ready-320/*.png
            .dpro-ready/ESTHE-PRODUCT-READY-R1-320-QA.json
            .dpro-ready/ESTHE-PRODUCT-READY-R1-WORKER-STATIC-QA.json
          if-no-files-found: warn
          retention-days: 90

      - name: "Commit READY evidence and self-delete workflow"
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DPRO Product Ready Actions"
          git config user.email "actions@users.noreply.github.com"
          git add ready-contract.json .dpro-ready/worker-esthe-product-ready-r1.js .dpro-ready/ESTHE-PRODUCT-READY-R1-WORKER-STATIC-QA.json .dpro-ready/ESTHE-PRODUCT-READY-R1-320-QA.json
          git rm --ignore-unmatch .github/workflows/ESTHE-PRODUCT-READY-R1.yml .github/workflows/ESTHE-PRODUCT-READY-R2.yml
          git commit -m "DPRO ESTHE PRODUCT READY R1: contract and 320 browser QA"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "READY_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: "Confirm published frontend contract"
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://dpromstk2000-lab.github.io/dpro-esthe-relax-line-liff/ready-contract.json"
          OK=false
          for n in $(seq 1 36); do
            BODY="$(curl -L -sS --retry 2 --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache, no-store' "$URL?ready=${{ env.READY_COMMIT }}_$n" || true)"
            if [[ "$BODY" == *'"frontendVersion": "ESTHE-PAGES-READY-R1-20260822"'* && "$BODY" == *'"contractVersion": "DPRO-ESTHE-NEXT-1.0.1-READY-R1"'* ]]; then
              OK=true; break
            fi
            sleep 10
          done
          [[ "$OK" == "true" ]] || { echo "::error::ready-contract.json publication not confirmed"; exit 1; }
          echo "Published contract: $URL"
