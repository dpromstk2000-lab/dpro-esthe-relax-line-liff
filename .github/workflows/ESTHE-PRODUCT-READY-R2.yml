name: "DPRO ESTHE PRODUCT READY R2 - Contract + 320 QA (Playwright path fix)"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ESTHE-PRODUCT-READY-R2.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: "dpro-esthe-product-ready-r2"
  cancel-in-progress: false

jobs:
  product-ready-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: "Checkout current ESTHE source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "Verify locked baseline before adding READY adapter evidence"
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s index-brush.html
          test -s member.html
          test -s owner.html
          test -s owner-ipad.html
          test -s staff.html
          grep -q '<!-- STEP ESTHE-NEXT-7 -->' index-brush.html
          grep -q '<!-- STEP ESTHE-NEXT-7 -->' member.html
          grep -q '<!-- STEP ESTHE-NEXT-8 -->' owner.html
          grep -q '<!-- STEP ESTHE-NEXT-6 -->' owner-ipad.html
          grep -q '<!-- STEP ESTHE-NEXT-6 -->' staff.html
          grep -q 'id="repeatVisitPanel"' member.html
          grep -q 'id="repeatBookingBanner"' index-brush.html
          grep -q 'id="followupCommandCenter"' owner.html
          grep -q 'id="fieldCommandCenter"' staff.html
          echo "LOCKED BASELINE VERIFIED"

      - name: "Create Product READY contract and reviewed Worker source"
