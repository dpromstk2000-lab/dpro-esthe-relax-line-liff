name: ESTHE Tutorial R4 Guide Center Live QA

on:
  push:
    branches: [ main ]
    paths:
      - 'guide-center.html'
      - '.github/workflows/esthe-tutorial-r4-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide-center-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for GitHub Pages R4 marker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dpromstk2000-lab.github.io/dpro-esthe-relax-line-liff/guide-center.html?sha=${GITHUB_SHA}"
          for i in $(seq 1 60); do
            if curl -fsSL "$URL" -o /tmp/esthe-guide-live.html &&
               grep -q 'ESTHE-R4-GUIDE-V1.0-20260828' /tmp/esthe-guide-live.html; then
              echo "Pages R4 marker ready"
              exit 0
            fi
            sleep 5
          done
          echo "Pages R4 marker not ready" >&2
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run R4 Guide Center LIVE QA
        shell: bash
        run: |
          cat > r4qa.mjs <<'EOFJS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const BASE='https://dpromstk2000-lab.github.io/dpro-esthe-relax-line-liff/';
          const viewports=[
            {name:'desktop',width:1440,height:1000},
            {name:'tablet',width:1024,height:768},
            {name:'mobile390',width:390,height:844},
            {name:'mobile320',width:320,height:720},
          ];
          const report={version:'ESTHE-R4-GUIDE-V1.0-20260828',checkedAt:new Date().toISOString(),viewports:[],stateFlow:null,summary:{pass:true,failures:[]}};
          const fail=m=>{report.summary.pass=false;report.summary.failures.push(m)};
          const browser=await chromium.launch();
          try{
            for(const vp of viewports){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.width<=390,isMobile:false});
              const page=await context.newPage();
              const pageerrors=[];const consoleErrors=[];const writes=[];
              page.on('pageerror',e=>pageerrors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('request',r=>{if(!['GET','HEAD','OPTIONS'].includes(r.method()))writes.push({method:r.method(),url:r.url()})});
              await page.goto(BASE+'guide-center.html',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.__DPRO_GUIDE_CENTER__?.total===10);
              const metric=await page.evaluate(()=>({
                innerWidth:window.innerWidth,
                documentScrollWidth:document.documentElement.scrollWidth,
                bodyScrollWidth:document.body.scrollWidth,
                total:window.__DPRO_GUIDE_CENTER__.total,
                steps:document.querySelectorAll('#first10Grid .step').length,
                marker:window.__DPRO_GUIDE_CENTER__.marker,
                activeId:document.activeElement?.id||'',
                startText:document.querySelector('#guideStart')?.textContent||'',
                resumeText:document.querySelector('#guideResume')?.textContent||'',
                replayText:document.querySelector('#guideReplay')?.textContent||''
              }));
              if(metric.innerWidth!==vp.width)fail(`${vp.name}: innerWidth ${metric.innerWidth} != ${vp.width}`);
              if(metric.total!==10||metric.steps!==10)fail(`${vp.name}: First10 count mismatch ${metric.total}/${metric.steps}`);
              if(vp.width<=390&&(metric.documentScrollWidth>metric.innerWidth||metric.bodyScrollWidth>metric.innerWidth))fail(`${vp.name}: horizontal overflow`);
              await page.keyboard.press('Tab');
              const focused=await page.evaluate(()=>({id:document.activeElement?.id||'',tag:document.activeElement?.tagName||''}));
              if(!focused.id&&!['A','BUTTON','INPUT'].includes(focused.tag))fail(`${vp.name}: keyboard focus not visible/reachable`);
              if(pageerrors.length)fail(`${vp.name}: pageerror ${pageerrors.join(' | ')}`);
              if(writes.length)fail(`${vp.name}: unsafe write ${JSON.stringify(writes)}`);
              report.viewports.push({viewport:vp,metric,focused,pageerrors,consoleErrors,writes});
              await context.close();
            }

            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            const pageerrors=[];const writes=[];
            page.on('pageerror',e=>pageerrors.push(String(e)));
            page.on('request',r=>{if(!['GET','HEAD','OPTIONS'].includes(r.method()))writes.push({method:r.method(),url:r.url()})});

            // Start alignment: clean state -> Guide Start -> live R3 STEP 1.
            await page.goto(BASE+'guide-center.html',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>localStorage.removeItem('dpro_tutorial_esthe_first10_v1_1'));
            await page.reload({waitUntil:'domcontentloaded'});
            await page.locator('#guideStart').click();
            await page.waitForURL(/demo-guide\.html.*dpro_tutorial=1/,{timeout:15000});
            await page.waitForFunction(()=>window.__DPRO_TUTORIAL__?.total===10&&window.__DPRO_TUTORIAL__?.state?.currentStep===1,{timeout:15000});
            const start=await page.evaluate(()=>({total:window.__DPRO_TUTORIAL__.total,step:window.__DPRO_TUTORIAL__.state.currentStep,status:window.__DPRO_TUTORIAL__.state.status,target:window.__DPRO_TUTORIAL__.target}));
            if(start.total!==10||start.step!==1||start.status!=='in_progress'||!start.target?.found)fail('stateFlow: Start alignment failed');

            // Progress to STEP 3, pause with Esc, then Resume from Guide Center.
            await page.locator('#dproTutorialNext').click();
            await page.locator('#dproTutorialNext').click();
            await page.waitForURL(/index-brush\.html.*dpro_tutorial=1/,{timeout:15000});
            await page.waitForFunction(()=>window.__DPRO_TUTORIAL__?.state?.currentStep===3,{timeout:15000});
            await page.keyboard.press('Escape');
            await page.waitForFunction(()=>window.__DPRO_TUTORIAL__?.state?.status==='paused',{timeout:15000});
            await page.goto(BASE+'guide-center.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__DPRO_GUIDE_CENTER__?.total===10);
            const guidePaused=await page.evaluate(()=>({state:window.__DPRO_GUIDE_CENTER__.readState(),resumeText:document.querySelector('#guideResume').textContent}));
            if(guidePaused.state?.currentStep!==3||guidePaused.state?.status!=='paused'||!guidePaused.resumeText.includes('STEP 3'))fail('stateFlow: Guide paused-state display failed');
            await page.locator('#guideResume').click();
            await page.waitForURL(/index-brush\.html.*dpro_tutorial=1/,{timeout:15000});
            await page.waitForFunction(()=>window.__DPRO_TUTORIAL__?.state?.currentStep===3&&window.__DPRO_TUTORIAL__?.state?.status==='in_progress',{timeout:15000});
            const resumed=await page.evaluate(()=>({step:window.__DPRO_TUTORIAL__.state.currentStep,status:window.__DPRO_TUTORIAL__.state.status,target:window.__DPRO_TUTORIAL__.target}));
            if(resumed.step!==3||resumed.status!=='in_progress'||!resumed.target?.found)fail('stateFlow: Resume alignment failed');

            // Replay alignment: Guide Replay must reset to live STEP 1.
            await page.goto(BASE+'guide-center.html',{waitUntil:'domcontentloaded'});
            await page.locator('#guideReplay').click();
            await page.waitForURL(/demo-guide\.html.*dpro_tutorial=1/,{timeout:15000});
            await page.waitForFunction(()=>window.__DPRO_TUTORIAL__?.state?.currentStep===1&&window.__DPRO_TUTORIAL__?.state?.status==='in_progress',{timeout:15000});
            const replay=await page.evaluate(()=>({step:window.__DPRO_TUTORIAL__.state.currentStep,status:window.__DPRO_TUTORIAL__.state.status,target:window.__DPRO_TUTORIAL__.target}));
            if(replay.step!==1||replay.status!=='in_progress'||!replay.target?.found)fail('stateFlow: Replay alignment failed');

            // Guide reference routes are all safe GET navigations and should be reachable.
            const routes=['demo-guide.html','index-brush.html?v=esthe-next-10b','member.html','staff.html','owner-ipad.html','owner.html','system-check.html','tutorial-start.html'];
            const routeStatus=[];
            for(const route of routes){const res=await page.request.get(BASE+route);routeStatus.push({route,status:res.status()});if(res.status()!==200)fail(`route ${route}: HTTP ${res.status()}`)}
            if(pageerrors.length)fail(`stateFlow: pageerror ${pageerrors.join(' | ')}`);
            if(writes.length)fail(`stateFlow: unsafe write ${JSON.stringify(writes)}`);
            report.stateFlow={start,guidePaused,resumed,replay,routeStatus,pageerrors,writes};
            await context.close();
          } finally {await browser.close()}
          fs.writeFileSync('esthe-r4-live-qa.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.summary.pass)process.exit(1);
          EOFJS
          node r4qa.mjs

      - name: Upload R4 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esthe-r4-live-qa
          path: esthe-r4-live-qa.json
          if-no-files-found: error
